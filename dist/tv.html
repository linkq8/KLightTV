<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KLightTV · الكويت</title>
<style>
  @font-face{font-family:'Thmanyah';font-weight:300;font-style:normal;font-display:block;src:url("fonts/Thmanyah-Light.woff2") format("woff2")}
  @font-face{font-family:'Thmanyah';font-weight:400;font-style:normal;font-display:block;src:url("fonts/Thmanyah-Regular.woff2") format("woff2")}
  @font-face{font-family:'Thmanyah';font-weight:500;font-style:normal;font-display:block;src:url("fonts/Thmanyah-Medium.woff2") format("woff2")}
  @font-face{font-family:'ThmanyahDisplay';font-weight:700;font-style:normal;font-display:block;src:url("fonts/ThmanyahDisplay-Bold.woff2") format("woff2")}

  :root{
    --sand:#F6EFE0;
    --dim:#C3B8A2;
    --gold:#DCB86F;
    --green-lt:#57D294;
    --red:#EE6A50;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* Hidden until the clock, the saved panels and the photo are in place, then one fade in: no half-built
     frames. The delayed animation shows it anyway if the script ever fails. */
  body{opacity:0;animation:reveal .3s 2.5s forwards}
  html.ready body{opacity:1;animation:none;transition:opacity .3s ease}
  @keyframes reveal{to{opacity:1}}
  /* card-only mode for the launcher */
  html.widget,html.widget body{background:transparent}
  html.widget .photo,html.widget .veil,html.widget .grain,html.widget .top-veil,html.widget .bottom-veil,
  html.widget .dimmer,html.widget #credit,html.widget .top,html.widget .clockwrap,html.widget .bottom{display:none}
  html.widget .stage{height:auto;padding:0;display:block;transition:none}
  html.widget .mid{display:block}
  html.widget .week{width:100%}
  html,body{
    height:100%;overflow:hidden;background:#040E09;color:var(--sand);
    font-family:'Thmanyah',system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;cursor:none;
  }

  .photo{
    position:fixed;inset:0;z-index:0;
    background-image:none;
    background-color:#040E09;
    background-size:cover;
    background-position:center 26%;
    background-repeat:no-repeat;
    transform:scale(1.03);   /* edges stay covered while it settles */
  }
  /* each photo's darkness as a plain black layer: same look as filter:brightness, nothing to recompute */
  .photo::after{content:'';position:absolute;inset:0;background:#000;opacity:var(--dim,.05)}
  .veil{
    position:fixed;inset:0;z-index:1;
    background:
      linear-gradient(180deg,rgba(3,10,7,.62) 0%,rgba(3,10,7,.30) 22%,rgba(3,10,7,.12) 46%,rgba(3,10,7,.42) 74%,rgba(2,6,4,.88) 100%),
      radial-gradient(120% 85% at 22% 34%,rgba(3,14,9,.42) 0%,rgba(3,14,9,0) 58%);
  }
  /* photo credits live in PHOTO-CREDITS.md on GitHub, not on screen */
  #credit{display:none;
    position:fixed;left:26px;bottom:6px;z-index:4;
    font-size:10px;letter-spacing:.02em;
    color:rgba(246,239,224,.30);pointer-events:none;
  }
  .top-veil{
    position:fixed;left:0;top:0;width:56vw;height:34vh;z-index:3;pointer-events:none;
    background:radial-gradient(120% 100% at 0% 0%,rgba(2,9,6,.82) 0%,rgba(2,9,6,.42) 45%,rgba(2,9,6,0) 76%);
  }
  .bottom-veil{
    position:fixed;left:0;right:0;bottom:0;height:30vh;z-index:3;pointer-events:none;
    background:linear-gradient(180deg,rgba(2,7,4,0) 0%,rgba(2,7,4,.55) 42%,rgba(2,6,4,.86) 100%);
  }

  .stage{
    position:relative;z-index:5;height:100vh;
    padding:3.1vh 3.6vw 5.4vh;
    display:grid;grid-template-rows:auto 1fr auto;gap:1.5vh;
  }

  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:2.5vw}

  .up{color:var(--green-lt)}.down{color:var(--red)}

  .week{
    width:min(760px,48vw);justify-self:end;
    background:rgba(4,14,9,.60);   /* no backdrop blur: over a moving photo it is redone every frame */
    border:1px solid rgba(220,184,111,.16);
    border-radius:12px;
    padding:1.7vh 1.4vw;
  }
  .week .hd{
    display:flex;align-items:center;gap:.7em;margin-bottom:1vh;
    font-size:clamp(12px,1vw,18px);font-weight:500;letter-spacing:0;color:#D6AF6B;
  }
  .week .hd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(220,184,111,.5),transparent)}
  .week ul{list-style:none;display:flex;flex-direction:column;gap:0}
  .week li{
    display:flex;align-items:baseline;gap:1.05em;
    font-size:clamp(14px,1.16vw,22px);font-weight:400;color:#F6EEDC;
    white-space:nowrap;line-height:1.3;
    padding:.8vh 0;border-bottom:1px solid rgba(220,184,111,.13);
  }
  .week li:last-child{border-bottom:none}
  .week li span:first-child{flex:0 1 auto;max-width:68%;overflow:hidden;text-overflow:ellipsis;padding-bottom:.3em;margin-bottom:-.3em}
  .week li .ep{flex:0 0 auto;color:#9FB8A8;font-size:.74em;font-variant-numeric:tabular-nums}
  .week li .rt{flex:0 0 auto;color:#E0BA74;font-size:.74em;font-variant-numeric:tabular-nums}
  .week li .dt{flex:1 1 auto;color:#9C9279;font-size:.72em;min-width:3.2em;text-align:left}
  .week ul.flip li{animation:weekIn .5s ease both}
  .week ul.flip li:nth-child(2){animation-delay:.06s}
  .week ul.flip li:nth-child(3){animation-delay:.12s}
  .week ul.flip li:nth-child(4){animation-delay:.18s}
  .week ul.flip li:nth-child(5){animation-delay:.24s}
  @keyframes weekIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .week li.past{color:#8F8670}
  .week li.next{color:#FFE9B8}
  .week li.next .dt{color:#E0BA74}
  .week .empty{color:#9A9078;font-size:clamp(14px,1.1vw,21px);font-weight:300;margin-top:1vh}
  /* Large, high-contrast prayer times for viewing from across the room. */
  html:not(.widget) .week .hd{font-size:clamp(16px,1.35vw,27px)}
  html:not(.widget) .week.prayers li{
    font-size:clamp(20px,1.9vw,38px);font-weight:700;
    padding:.9vh 0;color:var(--sand);
  }
  html:not(.widget) .week.prayers li .dt{
    font-size:1.2em;font-weight:700;color:#FFFDF6;
  }
  html:not(.widget) .week.prayers li.next,
  html:not(.widget) .week.prayers li.next .dt{color:#FFE2A0}

  .dates{text-align:right;flex-shrink:0}
  .hijri{font-size:clamp(19px,1.86vw,37px);font-weight:500;color:var(--sand);line-height:1.3}
  .greg{margin-top:.55vh;font-size:clamp(12px,1.06vw,21px);font-weight:300;color:var(--dim)}
  /* starts at the screen edge, under the first letters, and fades toward the middle */
  .rule{margin-top:1.2vh;width:clamp(100px,9vw,190px);height:1px;margin-left:auto;margin-right:0;
    background:linear-gradient(270deg,var(--gold),rgba(220,184,111,0))}

  /* the card keeps its width on the left; the clock is centred in the space between it and the right edge */
  .mid{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4.5vw}
  .clockwrap{display:flex;flex-direction:column;align-items:center;justify-self:center}
  .clock{
    display:flex;align-items:baseline;justify-content:center;direction:ltr;
    font-family:'ThmanyahDisplay','Thmanyah',serif;
    font-weight:700;
    font-size:clamp(120px,min(17vw,31vh),345px);line-height:.92;letter-spacing:.022em;
    color:#FFFDF6;font-variant-numeric:tabular-nums;
    text-shadow:0 4px 70px rgba(0,0,0,.65), 0 0 130px rgba(255,236,190,.12);
  }
  .clock .d{unicode-bidi:isolate}
  .clock .d i{font-style:normal}
  .clock .d i + i{margin-left:var(--digit-gap,.09em)}
  .clock .sep{
    font-size:.46em;align-self:center;transform:translateY(-.08em);color:var(--gold);opacity:.9;padding:0 .1em;
  }
  .clock .ampm{
    font-size:.28em;font-weight:500;color:var(--gold);
    align-self:flex-start;margin-top:.12em;margin-inline-end:.25em;
  }
  .subline{
    margin-top:1.4vh;display:flex;align-items:center;gap:.7em;
    font-size:clamp(12px,1.02vw,20px);font-weight:300;letter-spacing:.3em;color:#D8CDB6;
  }
  /* Older TV WebViews break Arabic joining when letter spacing is applied. */
  .subline,.panel .label,.week .hd{letter-spacing:0}
  .subline .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.9}

  .bottom{
    display:grid;grid-template-columns:1fr;
    gap:2.4vw;align-items:start;
    border-top:1px solid rgba(220,184,111,.30);
    padding-top:2.1vh;
  }
  .panel{min-width:0}
  .panel .label{
    font-size:clamp(12px,.98vw,18px);font-weight:500;letter-spacing:0;
    color:#D6AF6B;margin-bottom:.8vh;white-space:nowrap;
  }
  .panel .big{
    display:flex;align-items:baseline;gap:.4em;flex-wrap:nowrap;white-space:nowrap;min-width:0;line-height:1.1;
    font-weight:700;font-family:'ThmanyahDisplay','Thmanyah',serif;font-size:clamp(22px,2vw,42px);color:var(--sand);
  }
  .panel .num{color:#FFFCF2;font-size:1.12em;font-variant-numeric:tabular-nums;font-weight:500}
  .panel .unit{font-size:.56em;font-weight:500;color:var(--gold)}
  .panel .sub{
    margin-top:.85vh;font-size:clamp(12px,1vw,19px);font-weight:300;color:#C6BBA4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:.3em;margin-bottom:-.3em;
  }
  .panel .sub b{color:#F0E6D0;font-weight:500}

  .p-prayer{text-align:right}
  .p-prayer .big{justify-content:flex-start}
  .p-mid{text-align:left}
  .p-mid .big{display:block;text-align:left;line-height:1.06}
  .p-mid .num{font-size:1.3em;line-height:1}
  .p-mid .unit{font-size:.46em;font-weight:500;color:#D6AF6B;letter-spacing:.02em;display:inline;vertical-align:.5em}
  /* Current weather stays visible beneath the clock alongside the prayer card. */
  .weather{text-align:center;margin-top:3vh;max-width:100%}
  .wxline{display:flex;align-items:baseline;gap:.5em;justify-content:center;line-height:1.3;
    font-size:clamp(22px,2.25vw,44px);font-weight:700;color:var(--sand)}
  .wxt{font-family:'ThmanyahDisplay','Thmanyah',serif;font-weight:700;color:#FFFCF2;direction:ltr;
    font-variant-numeric:tabular-nums}
  .wxd.dust{color:#E8B86A}
  .wxsub{margin-top:.8vh;font-size:clamp(15px,1.3vw,26px);font-weight:500;color:#E2D7C2;white-space:nowrap}
  .wxr:not(:empty)::before{content:'  ·  ';white-space:pre;color:rgba(214,175,107,.7)}
  .wxt:empty,.wxd:empty,.wxr:empty{display:none}
  .rule.l{margin-left:0;margin-right:auto;background:linear-gradient(90deg,var(--gold),rgba(220,184,111,0))}
  .p-prayer.now .big{color:#FFE9B8;text-shadow:0 0 40px rgba(220,184,111,.45)}
  .p-prayer.now .label{color:#F1CF8A}
  .p-prayer .label{font-size:clamp(16px,1.3vw,26px);font-weight:700}
  .p-prayer .big{font-size:clamp(32px,3.2vw,64px)}
  .p-prayer .num{font-weight:700}
  .p-prayer .sub{font-size:clamp(20px,1.9vw,38px);font-weight:700;color:var(--sand)}
  .p-prayer .sub b{font-weight:700}

  /* One transparent home WebView: large table on the left, weather below the native clock. */
  html.home .stage{height:100%}
  html.home .mid{height:100%;display:grid;grid-template-columns:1fr 53%;gap:4%}
  html.home .clockwrap{display:block;align-self:start;justify-self:stretch;margin-top:80px}
  html.home .clock,html.home .subline{display:none}
  html.home .weather{margin:0;text-align:right}
  html.home .wxline{justify-content:flex-start;font-size:clamp(24px,3.1vw,28px)}
  html.home .wxsub{font-size:clamp(16px,2vw,18px);margin-top:8px;white-space:normal}
  html.home .week{width:100%;padding:8px 14px}
  html.home .week .hd{font-size:16px;font-weight:700;line-height:1.25;margin-bottom:4px}
  html.home .week.prayers li{font-size:clamp(18px,2.3vw,20px);font-weight:700;line-height:1.15;padding:2.5px 0;color:var(--sand)}
  html.home .week.prayers li .dt{font-size:1.15em;font-weight:700;color:#FFFDF6}
  html.home .week.prayers li.next,html.home .week.prayers li.next .dt{color:#FFE2A0}

  .dimmer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:30;transition:opacity 6s linear}
  .stage{transition:transform 3s ease}


  @media (max-aspect-ratio:5/4){
    .top{flex-direction:column-reverse;gap:1.4vh}
    .bottom{grid-template-columns:1fr}


  }
</style>
</head>
<body>
<div class="photo"></div>
<div id="credit"></div>
<div class="veil"></div>
<div class="top-veil"></div>
<div class="bottom-veil"></div>
<div class="dimmer" id="dimmer"></div>

<main class="stage">

  <header class="top">
    <div class="dates">
      <div class="hijri" id="hijri">—</div>
      <div class="greg" id="greg">—</div>
      <div class="rule"></div>
    </div>

  </header>

  <section class="mid">
    <div class="clockwrap">
      <div class="clock">
        <span class="ampm" id="ck-ap">—</span><span class="d" id="ck-h">--</span><span class="sep">:</span><span class="d" id="ck-m">--</span>
      </div>
      <div class="subline"><span class="dot"></span><span id="clock-sub">بتوقيت مدينة الكويت</span></div>
      <div class="weather">
        <div class="wxline"><span class="wxt" id="wx-temp"></span><span class="wxd" id="wx-desc"></span></div>
        <div class="wxsub"><span id="wx-city">مدينة الكويت</span><span class="wxr" id="wx-range"></span></div>
      </div>
    </div>

    <div class="week">
      <div class="hd" id="week-hd">مواقيت اليوم</div>
      <ul id="week-list"><li class="empty">جارٍ التحميل…</li></ul>
    </div>
  </section>

  <footer class="bottom">
    <div class="panel p-prayer">
      <div class="label" id="prayer-label">الصلاة القادمة</div>
      <div class="big"><span id="prayer-name">—</span><span class="num" id="prayer-time"></span></div>
      <div class="sub" id="prayer-count">—</div>
    </div>

  </footer>

</main>

<script>
// daily background: one photo per Kuwait day, deterministic
const BGS = [
{"u": "backgrounds/composed.jpg", "c": "KLightTV · AI-enhanced Kuwait composition", "d": 0.96},
{"u": "backgrounds/dusk.jpg", "c": "Frans van Heerden · Pexels", "d": 0.96},
{"u": "backgrounds/water.jpg", "c": "Shashi Ghosh · Unsplash", "d": 0.96},
{"u": "backgrounds/sunset.jpg", "c": "Quintin Gellar · Pexels", "d": 0.96}
];
// the app passes the chosen city in the URL fragment: #city=..&lat=..&lon=..&tz=..
const _Q = new URLSearchParams((location.hash || '').replace(/^#/, ''));
const _num = (k, d) => { const v = parseFloat(_Q.get(k)); return isNaN(v) ? d : v; };
const CONFIG = {
  city: _Q.get('city') || 'مدينة الكويت',
  latitude: _num('lat', 29.3759),
  longitude: _num('lon', 47.9774),
  timezone: 'Asia/Kuwait',
  prayerMethod: 9,
  panel: (p => ['prayers','forecast','none'].includes(p) ? p : 'prayers')(_Q.get('panel')),
  widget: _Q.get('widget') === '1',
  home: _Q.get('home') === '1',
};

const GREG = 'ar-KW-u-ca-gregory-nu-arab';
const AR = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
const ar = s => String(s).replace(/[0-9]/g, d => AR[+d]);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');

function kuwaitParts(d = new Date()){
  const f = new Intl.DateTimeFormat('en-GB',{
    timeZone: CONFIG.timezone, hour12:false,
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  }).formatToParts(d).reduce((a,p)=>(a[p.type]=p.value,a),{});
  return { y:+f.year, mo:+f.month, d:+f.day, h:(+f.hour)%24, mi:+f.minute, s:+f.second };
}
function fmt12(h, mi){
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${ar(h12)}:${ar(pad(mi))} ${h < 12 ? 'ص' : 'م'}`;
}

function tickClock(){
  const p = kuwaitParts();
  const h12 = p.h % 12 === 0 ? 12 : p.h % 12;
  // one box per digit: browsers ignore letter-spacing on Arabic digits, and ٤ reaches into the next digit
  const digits = s => [...s].map(ch => '<i>' + ch + '</i>').join('');
  const key = h12 + ':' + p.mi;
  if(key === tickClock.last) return;   // ticks every second, redraws once a minute
  tickClock.last = key;
  document.getElementById('ck-h').innerHTML = digits(ar(h12));
  document.getElementById('ck-m').innerHTML = digits(ar(pad(p.mi)));
  document.getElementById('ck-ap').textContent = p.h < 12 ? 'ص' : 'م';
}

function tickDates(){
  const now = new Date();
  try{
    let h = new Intl.DateTimeFormat('ar-KW-u-ca-islamic-umalqura',{
      timeZone: CONFIG.timezone, weekday:'long', day:'numeric', month:'long', year:'numeric'
    }).format(now);
    h = h.replace(/\s*هـ\s*$/,'').replace(/،\s*$/,'');
    document.getElementById('hijri').textContent = h + ' هـ';
  }catch(e){}
  try{
    document.getElementById('greg').textContent = new Intl.DateTimeFormat(GREG,{
      timeZone: CONFIG.timezone, weekday:'long', day:'numeric', month:'long', year:'numeric'
    }).format(now);
  }catch(e){}
}

const PRAYER_KEYS = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
const PRAYER_NAMES = {Fajr:'الفجر',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};
let PRAYERS = [];

let DAY_TIMES = null;
function buildPrayers(t){
  DAY_TIMES = t;
  PRAYERS = PRAYER_KEYS.map(k=>{
    const [h,mi] = String(t[k]).split(':').map(Number);
    return {key:k, name:PRAYER_NAMES[k], h, mi};
  });
}

// Aladhan Kuwait method 9: Fajr 18°, Isha 17.5°, Asr shadow factor 1.
function computePrayers(){
  const p = kuwaitParts(), lat = CONFIG.latitude, lng = CONFIG.longitude;
  const tz = Math.round((Date.UTC(p.y,p.mo-1,p.d,p.h,p.mi,p.s) - Date.now()) / 60000) / 60;
  const rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
  const fix = (a,b) => { a = a - b*Math.floor(a/b); return a < 0 ? a + b : a; };
  const jd0 = Date.UTC(p.y,p.mo-1,p.d)/86400000 + 2440587.5 - lng/(15*24);
  const sun = t => {
    const D = jd0 + t - 2451545;
    const g = fix(357.529 + .98560028*D, 360), q = fix(280.459 + .98564736*D, 360);
    const L = fix(q + 1.915*Math.sin(rad(g)) + .020*Math.sin(rad(2*g)), 360);
    const e = 23.439 - .00000036*D;
    const RA = fix(deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)), Math.cos(rad(L))))/15, 24);
    return {decl: deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L)))), eqt: q/15 - RA};
  };
  const noon = t => fix(12 - sun(t/24).eqt, 24);
  const angleTime = (angle, t, ccw) => {
    const d = sun(t/24).decl, n = noon(t);
    const T = deg(Math.acos((-Math.sin(rad(angle)) - Math.sin(rad(d))*Math.sin(rad(lat))) /
                            (Math.cos(rad(d))*Math.cos(rad(lat)))))/15;
    return n + (ccw ? -T : T);
  };
  const asrTime = t => {
    const d = sun(t/24).decl;
    const a = -deg(Math.atan(1/(1 + Math.tan(rad(Math.abs(lat - d))))));
    return angleTime(a, t, false);
  };
  const adj = h => h + tz - lng/15;
  const fajr = adj(angleTime(18, 5, true)), dhuhr = adj(noon(12)), asr = adj(asrTime(13));
  const sunrise = adj(angleTime(.833, 6, true));
  const maghrib = adj(angleTime(.833, 18, false));
  const isha = adj(angleTime(17.5, 18, false));
  const hm = h => { const m = Math.round(fix(h, 24)*60) % 1440; return pad(Math.floor(m/60)) + ':' + pad(m%60); };
  return {Fajr:hm(fajr), Sunrise:hm(sunrise), Dhuhr:hm(dhuhr), Asr:hm(asr), Maghrib:hm(maghrib), Isha:hm(isha)};
}

async function loadPrayers(){
  buildPrayers(computePrayers());
  tickPrayer();
  if(CONFIG.panel === 'prayers') renderPanel(false);
  const p = kuwaitParts();
  const url = `https://api.aladhan.com/v1/timings/${pad(p.d)}-${pad(p.mo)}-${p.y}`
            + `?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}`
            + `&method=${CONFIG.prayerMethod}&timezonestring=${encodeURIComponent(CONFIG.timezone)}`;
  try{
    const r = await fetchT(url, 12000);
    const j = await r.json();
    if(!r.ok || !j?.data?.timings || !['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'].every(k => /^([01]\d|2[0-3]):[0-5]\d/.test(j.data.timings[k] || ''))) throw 0;
    buildPrayers(j.data.timings);
  }catch(e){
    try{ buildPrayers(computePrayers()); }catch(_){}
  }
  tickPrayer();
  if(CONFIG.panel === 'prayers') renderPanel(false);
}

const UNIT = {
  day: {one:'يوم', two:'يومين', few:'أيام', many:'يوم'},
  hour:{one:'ساعة', two:'ساعتين', few:'ساعات', many:'ساعة'},
  min: {one:'دقيقة', two:'دقيقتين', few:'دقائق', many:'دقيقة'}
};
function qty(n,u){
  if(n === 2) return u.two;
  if(n >= 3 && n <= 10) return `${ar(n)} ${u.few}`;
  return `${ar(n)} ${u.many}`;
}
function humanRemaining(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), out = [];
  if(h) out.push(qty(h,UNIT.hour));
  if(m || !h) out.push(qty(m,UNIT.min));
  return out.join(' و ');
}
function isFriday(){
  return new Intl.DateTimeFormat('en-US',{timeZone:CONFIG.timezone,weekday:'short'}).format(new Date()) === 'Fri';
}
function prayerName(x){ return x.key === 'Dhuhr' && isFriday() ? 'الجمعة' : x.name; }

function tickPrayer(){
  const elL=document.getElementById('prayer-label'),
        elN=document.getElementById('prayer-name'),
        elT=document.getElementById('prayer-time'),
        elC=document.getElementById('prayer-count'),
        panel=document.querySelector('.p-prayer');
  if(!PRAYERS.length) return;
  const p = kuwaitParts();
  const mins = p.h*60 + p.mi;

  panel.classList.remove('now');
  elL.textContent = 'الصلاة القادمة';
  let next = PRAYERS.find(x => (x.h*60+x.mi) > mins);
  const leftM = next ? (next.h*60 + next.mi) - mins
                     : (PRAYERS[0].h*60 + PRAYERS[0].mi) + 1440 - mins;
  if(!next) next = PRAYERS[0];
  elN.textContent = prayerName(next);
  elT.textContent = fmt12(next.h, next.mi);
  elC.innerHTML = 'بعد <b>' + humanRemaining(Math.max(0, Math.round(leftM*60))) + '</b>';
}

async function fetchT(url, ms){
  const c = new AbortController(); const id = setTimeout(()=>c.abort(), ms||12000);
  try{ return await fetch(url,{cache:'no-store', signal:c.signal}); }
  finally{ clearTimeout(id); }
}

// ---- the card beside the clock: one of several contents, picked in the app
let FORECAST = [];
const PANEL_TITLE = {prayers:'مواقيت اليوم', forecast:'الأيام القادمة'};

function renderPanel(animate){
  const ul = document.getElementById('week-list'), hd = document.getElementById('week-hd');
  const P = CONFIG.panel;
  ul.closest('.week').classList.toggle('prayers', P === 'prayers');
  let rows = [];
  if(P === 'prayers') rows = prayerRows();
  else if(P === 'forecast') rows = forecastRows();
  if(PANEL_TITLE[P]) hd.textContent = PANEL_TITLE[P];
  if(!rows.length){
    ul.classList.remove('flip');
    ul.innerHTML = `<li class="empty">لا تتوفر بيانات الآن</li>`;
    return;
  }
  ul.innerHTML = rows.join('');
  ul.classList.remove('flip');
  if(animate){ void ul.offsetWidth; ul.classList.add('flip'); }
}

function prayerRows(){
  if(!DAY_TIMES) return [];
  const p = kuwaitParts(), now = p.h * 60 + p.mi;
  const names = {Fajr:'الفجر', Sunrise:'الشروق', Dhuhr:isFriday() ? 'الجمعة' : 'الظهر', Asr:'العصر', Maghrib:'المغرب', Isha:'العشاء'};
  let next = null;
  return Object.keys(names).filter(k => DAY_TIMES[k]).map(k => {
    const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number);
    const at = h * 60 + mi;
    let cls = at < now ? 'past' : '';
    if(at >= now && !next){ next = k; cls = 'next'; }
    return `<li class="${cls}"><span>${names[k]}</span><span class="dt">${fmt12(h, mi)}</span></li>`;
  });
}

function forecastRows(){
  return FORECAST.slice(0, 5).map((d, i) => {
    const day = i === 0 ? 'اليوم' : i === 1 ? 'غداً'
      : new Intl.DateTimeFormat(GREG, {timeZone:'UTC', weekday:'long'}).format(new Date(d.date + 'T12:00:00Z'));
    return `<li><span>${day}</span><span class="ep">${WX_CODES[d.code] || ''}</span>`
         + `<span class="dt">${ar(Math.round(d.hi))}° / ${ar(Math.round(d.lo))}°</span></li>`;
  });
}

const WX_CODES = {
  0:'صافي',1:'صافي غالباً',2:'غائم جزئياً',3:'غائم',45:'ضباب',48:'ضباب متجمد',
  51:'رذاذ',53:'رذاذ',55:'رذاذ كثيف',56:'رذاذ متجمد',57:'رذاذ متجمد',
  61:'مطر خفيف',63:'مطر',65:'مطر غزير',66:'مطر متجمد',67:'مطر متجمد',
  71:'ثلج خفيف',73:'ثلج',75:'ثلج كثيف',77:'حبيبات ثلج',
  80:'زخات خفيفة',81:'زخات مطر',82:'زخات غزيرة',85:'زخات ثلج',86:'زخات ثلج',
  95:'عواصف رعدية',96:'عواصف مصحوبة ببرد',99:'عواصف قوية'
};
async function loadWeather(){
  const q = `latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&timezone=${encodeURIComponent(CONFIG.timezone)}`;
  try{
    const r = await fetchT(`https://api.open-meteo.com/v1/forecast?${q}&current=temperature_2m,weather_code`
                         + `&daily=temperature_2m_max,temperature_2m_min,weather_code&forecast_days=5`, 12000);
    if(!r.ok) throw 0;
    const j = await r.json();
    document.getElementById('wx-temp').textContent = ar(Math.round(j.current.temperature_2m)) + '°';
    const d = document.getElementById('wx-desc');
    d.textContent = WX_CODES[j.current.weather_code] || '';
    d.classList.remove('dust');
    const hi = j.daily?.temperature_2m_max?.[0], lo = j.daily?.temperature_2m_min?.[0];
    document.getElementById('wx-range').textContent =
      (hi != null && lo != null) ? `${ar(Math.round(hi))}° / ${ar(Math.round(lo))}°` : '';
    const dl = j.daily || {};
    FORECAST = (dl.time || []).map((t, i) => ({date:t, code:dl.weather_code?.[i],
      hi:dl.temperature_2m_max?.[i], lo:dl.temperature_2m_min?.[i]})).filter(x => x.hi != null && x.lo != null);
    if(CONFIG.panel === 'forecast') renderPanel(false);
  }catch(e){ return; }   // keep the last reading; with none only the city shows

  // dust overrides the condition word: PM10 in µg/m³
  try{
    const r = await fetchT(`https://air-quality-api.open-meteo.com/v1/air-quality?${q}&current=pm10,dust`, 12000);
    if(!r.ok) throw 0;
    const c = (await r.json()).current || {};
    const pm = Math.max(c.pm10 || 0, c.dust || 0);
    if(pm >= 150){
      const d = document.getElementById('wx-desc');
      d.textContent = pm >= 400 ? 'غبار كثيف' : 'غبار';
      d.classList.add('dust');
    }
  }catch(e){}
}

// night dimming: transparent by day, dark after 21:00 and before 07:00
function applyNight(){
  const p = kuwaitParts();
  const h = p.h + p.mi/60;
  const MAX = 0.46;
  let o = 0;
  if(h >= 23 || h < 5)      o = MAX;
  else if(h >= 21)          o = MAX * (h - 21) / 2;
  else if(h < 7)            o = MAX * (7 - h) / 2;
  const el = document.getElementById('dimmer');
  if(el) el.style.opacity = Math.max(0, Math.min(MAX, o)).toFixed(2);
}

// gentle pixel shift so static text never burns into the panel
const SHIFT_SEQ = [[0,0],[3,2],[0,4],[-3,2],[-3,-2],[0,-4],[3,-2]];
let shiftTick = 0;
function pixelShift(){
  shiftTick = (shiftTick + 1) % SHIFT_SEQ.length;
  const [dx,dy] = SHIFT_SEQ[shiftTick];
  const st = document.querySelector('.stage');
  if(st) st.style.transform = `translate(${dx}px,${dy}px)`;
}

let REVEALED = false;
function reveal(){
  if(REVEALED) return;
  REVEALED = true;
  // fonts may still be arriving (tv.html loads them as files): wait for them, briefly
  const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fonts, new Promise(r => setTimeout(r, 800))])
    .then(() => document.documentElement.classList.add('ready'));
}

function showBackground(url, b){
  const ph = document.querySelector('.photo');
  reveal();
  if(!ph) return;
  const next = "url('" + url + "')";
  if(ph.style.backgroundImage === next) return;   // same photo: no reload, no new movement
  ph.style.backgroundImage = next;
  ph.style.setProperty('--dim', (1 - (b.d || 0.95)).toFixed(2));
  const cr = document.getElementById('credit');
  if(cr) cr.textContent = b.c ? 'الصورة: ' + b.c : '';
}

function kuwaitDayNumber(){
  const p = kuwaitParts();
  return Math.floor(Date.UTC(p.y, p.mo - 1, p.d) / 86400000);
}
// Three curated local photographs, rotated without network traffic or continuous animation.
let BG_SLOT = -1;
function applyBackground(force){
  const slot = Math.floor(Date.now() / (30 * 60000));
  if(slot === BG_SLOT && !force) return;
  BG_SLOT = slot;
  const b = BGS[slot % BGS.length];
  if(b) showBackground(b.u, b);
}

// Last painted panels, shown at once on the next start while fresh data loads.
const SNAP_KEY = 'kuwait-lite-1:' + location.hash;   // bump when the panels' markup changes
const SNAP_SEL = ['.weather', '#week-list'];
function saveSnap(){
  try{ localStorage.setItem(SNAP_KEY, JSON.stringify(SNAP_SEL.map(q => (document.querySelector(q)||{}).innerHTML || ''))); }catch(e){}
}
function restoreSnap(){
  try{
    const v = JSON.parse(localStorage.getItem(SNAP_KEY) || 'null');
    if(v) SNAP_SEL.forEach((q, i) => { const el = document.querySelector(q); if(el && v[i]) el.innerHTML = v[i]; });
  }catch(e){}
}

function boot(){
  if(CONFIG.widget){ bootWidget(); return; }
  restoreSnap();
  addEventListener('pagehide', saveSnap);
  document.getElementById('wx-city').textContent = CONFIG.city;
  document.getElementById('clock-sub').textContent = 'بتوقيت ' + CONFIG.city;
  document.title = 'تلفزيونك · الكويت';
  applyBackground(true);
  tickClock(); tickDates();
  if(CONFIG.panel === 'none') document.querySelector('.week').style.display = 'none';
  else renderPanel(false);
  loadPrayers(); loadWeather(); applyNight(); pixelShift();
  // Minute precision on screen: one aligned timer instead of second-by-second work.
  let lastDay = kuwaitDayNumber();
  function minute(){
    tickClock(); tickDates(); tickPrayer(); applyNight(); applyBackground(false);
    if(CONFIG.panel === 'prayers') renderPanel(false);
    if(kuwaitDayNumber() !== lastDay){ lastDay = kuwaitDayNumber(); loadPrayers(); loadWeather(); }
    saveSnap();
    setTimeout(minute, 60000 - Date.now() % 60000 + 25);
  }
  setTimeout(minute, 60000 - Date.now() % 60000 + 25);
  setInterval(loadPrayers, 6*3600*1000);
  setInterval(loadWeather, 30*60*1000);
  setInterval(pixelShift, 4*60*1000);
}

function bootWidget(){
  document.documentElement.classList.add('widget');
  if(CONFIG.home) document.documentElement.classList.add('home');
  restoreSnap();
  addEventListener('pagehide', saveSnap);
  document.getElementById('wx-city').textContent = CONFIG.city;
  const P = CONFIG.panel;
  if(P === 'none') document.querySelector('.week').style.display = 'none';
  else renderPanel(false);
  if(P === 'prayers'){ loadPrayers(); setInterval(loadPrayers, 6*3600*1000); }
  if(P === 'forecast' || CONFIG.home){ loadWeather(); setInterval(loadWeather, 30*60*1000); }
  let lastDay = kuwaitDayNumber();
  setInterval(() => {
    if(kuwaitDayNumber() !== lastDay){ lastDay = kuwaitDayNumber(); if(P === 'prayers') loadPrayers(); }
    if(P === 'prayers') renderPanel(false);
    saveSnap();
  }, 60000);
  reveal();
}

document.addEventListener('keydown', e=>{
  if(e.key === 'f' || e.key === 'F'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen().catch(()=>{});
  }
});

boot();
</script>
