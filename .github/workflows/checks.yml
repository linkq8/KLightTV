name: Checks

# tests/run.sh on every push: build, data, photos, fonts, scripts, private data, and the screen
# in a real browser. The Android apps are compiled by android.yml.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pip install fonttools brotli pillow
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: tests/run.sh
