name: Android APKs

on:
  push:
    branches: [main, master]
    paths: ['android/**', 'assets/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'assets/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: '8.11.1'
      - name: Build development APKs
        run: gradle -p android assembleDebug --no-daemon
      - name: Name artifacts
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk KLightTV-screensaver-development-android-tv.apk
          cp android/launcher/build/outputs/apk/debug/launcher-debug.apk KLightTV-home-development-android-tv.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KLightTV-development-android-tv
          path: KLightTV-*-development-android-tv.apk
# Development artifacts have the runner's debug signature. Official sideload updates
# are separately signed with the retained private release key and published immutably.
