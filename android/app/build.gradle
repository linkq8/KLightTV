plugins {
    id 'com.android.application'
}

android {
    namespace 'kw.urtv.screensaver'
    compileSdk 34

    defaultConfig {
        applicationId 'kw.urtv.screensaver'
        minSdk 26
        targetSdk 34
        // CI passes its run number so every build installs over the previous one; 3.x since the new signing key,
        // the same number as the home app and as the release (v3.N)
        versionCode((System.getenv('ANDROID_VERSION_CODE') ?: '12') as int)
        versionName "1.10.1"
    }

    signingConfigs {
        // the key lives only in the repository's secrets (made with .github/tools/make_signing_key.py) and CI refuses
        // to build without it; a local build without ANDROID_KEYSTORE gets the debug key, so it can't update the TV's apps
        if (System.getenv('ANDROID_KEYSTORE')) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'urtv'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }

    // Native screensaver; browser preview remains in dist/ for desktop use.
    sourceSets {
        main.java.srcDirs += ["../shared/src/main/java"]
        main { assets.srcDirs = ["$buildDir/generated/assets"] }   // native fonts and local backgrounds
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Native display assets: no WebView, HTML or browser fonts in the APK.
def copyRuntime = tasks.register('copyRuntime', Sync) {
    from('../launcher/src/main/assets/fonts') { include '*.otf'; into 'fonts' }
    from('../../assets/calendar') { include '*.json'; into 'calendar' }
    from('../../assets/backgrounds') { include '*.jpg'; into 'backgrounds' }
    into "$buildDir/generated/assets"
}
preBuild.dependsOn copyRuntime
