plugins {
    id 'com.android.application'
}

android {
    namespace 'kw.urtv.home'
    compileSdk 34

    defaultConfig {
        applicationId 'kw.urtv.home'
        minSdk 26
        targetSdk 30   // Android 11 TVs only show the Wi-Fi name to apps targeting 30 with location granted
        // the same version as the screensaver (see android/app/build.gradle)
        versionCode((System.getenv('ANDROID_VERSION_CODE') ?: '14') as int)
        versionName "1.10.3"
    }

    signingConfigs {
        // the key lives only in the repository's secrets (made with .github/tools/make_signing_key.py) and CI refuses
        // to build without it; a local build without ANDROID_KEYSTORE gets the debug key, so it can't update the TV's apps
        if (System.getenv('ANDROID_KEYSTORE')) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'urtv'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }

    // wallpapers are the screensaver's Kuwait photos, copied in at build time
    sourceSets {
        main.java.srcDirs += ["../shared/src/main/java"]
        main { assets.srcDirs += ["$buildDir/generated/wallpapers"] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Personal sideloaded TV build: keep target 30 for Android 11 Wi-Fi name compatibility.
    // The Google Play submission policy does not apply to this distribution.
    lint { abortOnError true; disable 'ExpiredTargetSdkVersion' }
}

def copyWallpapers = tasks.register('copyWallpapers', Sync) {
    from('../../assets/backgrounds') { include '*.jpg'; into 'wallpapers' }
    from('../../assets/calendar') { include '*.json'; into 'calendar' }
    into "$buildDir/generated/wallpapers"
}
preBuild.dependsOn copyWallpapers
